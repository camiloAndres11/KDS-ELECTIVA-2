# Kafka + Zookeeper + interfaz visual, tal como aparece en el documento del curso.
#
# Como levantarlo:
#     docker compose up -d
#
# Como ver que funciona:
#     - Interfaz visual:  http://localhost:8083
#     - Kafka en texto:    docker compose logs -f kafka
#     - Detenerlo:         docker compose down
#     - Detenerlo y borrar los datos: docker compose down -v
#
# Que es cada pieza:
#   zookeeper  -> guarda la configuracion del "grupo" de Kafka (quien es el lider).
#   kafka       -> el broker donde acaban los eventos.
#   kafka-ui    -> una pagina web para mirar los topics y los mensajes.

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: kds-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kds-kafka
    depends_on:
      - zookeeper
    restart: unless-stopped
    ports:
      # 9092 es el puerto que usa nuestra aplicacion Python para publicar.
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Dos "puertas" de entrada, y es la parte que mas confunde al principio:
      #
      #   PLAINTEXT (9092)          -> para los programas que estan FUERA de Docker
      #                              (nuestro Python). Se anuncia como localhost.
      #   PLAINTEXT_INTERNAL (29092) -> para los programas que estan DENTRO de la red
      #                              de Docker (kafka-ui). Se anuncia como kafka.
      #
      # Sin esto, kafka-ui intentaria conectarse a "localhost", que dentro del
      # contenedor es el propio kafka-ui, y fallaria.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      # Solo hay UN broker, asi que las replicas son 1. En produccion serian 3.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Comodo para una clase: crea los topics solos la primera vez que se usan,
      # sin tener que crear "seguridad.accesos" a mano.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kds-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    ports:
      # 8083 en el puerto del contenedor 8080.
      - "8083:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # Ojo: aqui se usa el puerto INTERNO (29092), porque kafka-ui
      # esta dentro de la red de Docker.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
