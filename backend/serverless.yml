service: kds-backend-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  environment:
    TENANT_ID: ${env:TENANT_ID, 'dev'}
    DATABASE_URL: ${env:DATABASE_URL}
    CORS_ORIGINS: ${env:CORS_ORIGINS, 'http://localhost:4200'}

functions:
  api:
    handler: dist/lambda.handler
    events:
      - httpApi:
          method: ANY
          path: /
      - httpApi:
          method: ANY
          path: /{proxy+}

package:
  excludeDevDependencies: true
  patterns:
    - 'dist/**'
    - 'node_modules/.prisma/**'
    - 'node_modules/@prisma/client/**'
    - '!node_modules/.cache/**'
    - '!node_modules/**/.cache/**'
    - '!node_modules/**/query_engine-windows.dll.node*'
    - '!node_modules/.bin/**'
    - '!node_modules/**/.bin/**'
    - '!node_modules/@serverless/**'
    - '!node_modules/@types/**'
    - '!node_modules/@vitest/**'
    - '!node_modules/jsdom/**'
    - '!node_modules/prisma/**'
    - '!node_modules/serverless/**'
    - '!node_modules/supertest/**'
    - '!node_modules/typescript/**'
    - '!node_modules/vitest/**'
    - '!node_modules/aws-sdk/**'
    - '!src/**'
    - '!tests/**'
